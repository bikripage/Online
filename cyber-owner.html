<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F7F9FE">

    <title>BikriPage | Smart Print PC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #087AFF;
            --blue-dark: #0562DB;
            --text: #111827;
            --muted: #7B8495;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100svh;
            color: var(--text);
            background:
                radial-gradient(ellipse at 50% 8%,
                    rgba(75, 155, 255, 0.15), transparent 45%),
                radial-gradient(ellipse at 95% 65%,
                    rgba(150, 190, 255, 0.12), transparent 40%),
                linear-gradient(145deg, #FFFFFF 0%, #F5F8FF 55%, #EEF4FF 100%);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        button, a {
            font: inherit;
        }

        /* Background decoration */
        .ambient {
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .35;
            pointer-events: none;
            z-index: 0;
        }

        .ambient.one {
            background: #8CC4FF;
            top: -130px;
            right: -100px;
        }

        .ambient.two {
            background: #B5C9FF;
            bottom: -150px;
            left: -120px;
        }

        /* Back button */
        .back-btn {
            position: absolute;
            top: 28px;
            left: 24px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #202B3C;
            background: rgba(255,255,255,.75);
            border: 1px solid rgba(20,40,80,.07);
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(30,60,110,.06);
            transition: .2s ease;
            z-index: 5;
        }

        .back-btn:active {
            transform: scale(.91);
        }

        /* Main layout */
        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 85px 24px 55px;
        }

        .content {
            width: 100%;
            max-width: 410px;
            text-align: center;
            animation: reveal .8s cubic-bezier(.16,1,.3,1) both;
        }

        /* Branding */
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #657187;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2.3px;
            text-transform: uppercase;
            margin-bottom: 42px;
        }

        .brand i {
            color: var(--blue);
            font-size: 15px;
        }

        /* Icon */
        .icon-area {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .app-icon {
            width: 116px;
            height: 116px;
            border-radius: 34px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 47px;
            background: linear-gradient(145deg, #2994FF, #0865E8 75%);
            box-shadow:
                0 18px 38px rgba(15,115,235,.22),
                inset 0 1px 1px rgba(255,255,255,.4);
            position: relative;
        }

        .windows-badge {
            position: absolute;
            width: 37px;
            height: 37px;
            right: calc(50% - 68px);
            bottom: -4px;
            background: #FFFFFF;
            color: #087AFF;
            border: 1px solid #E5EDFA;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            box-shadow: 0 5px 15px rgba(30,60,100,.12);
        }

        /* Heading */
        h1 {
            font-size: clamp(29px, 8vw, 36px);
            letter-spacing: -1.6px;
            font-weight: 800;
            line-height: 1.2;
            color: #101828;
            margin-bottom: 15px;
        }

        .description {
            color: #778195;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.6;
            max-width: 350px;
            margin: 0 auto 34px;
        }

        /* Download card */
        .download-card {
            padding: 9px;
            background: rgba(255,255,255,.72);
            border: 1px solid rgba(255,255,255,.95);
            border-radius: 25px;
            box-shadow:
                0 15px 45px rgba(43,78,130,.08),
                inset 0 1px 2px white;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            margin-bottom: 18px;
        }

        .download-btn {
            min-height: 64px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            background: linear-gradient(110deg, #168AFF, #0868E9);
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -.3px;
            box-shadow: 0 7px 18px rgba(10,115,240,.22);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .download-btn i {
            font-size: 20px;
        }

        .download-btn:active {
            transform: scale(.97);
            box-shadow: 0 3px 10px rgba(10,115,240,.15);
        }

        /* Credentials Box */
        .creds-box {
            background: rgba(255,255,255,.6);
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 22px;
            padding: 16px 20px;
            text-align: left;
            box-shadow: 0 8px 25px rgba(30,60,100,.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .cred-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        .cred-item:not(:last-child) {
            border-bottom: 1px solid rgba(0,0,0,.05);
            margin-bottom: 6px;
            padding-bottom: 12px;
        }

        .cred-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cred-label {
            font-size: 11px;
            font-weight: 700;
            color: #8792A4;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .cred-val {
            font-size: 15px;
            font-weight: 700;
            color: #101828;
            letter-spacing: -0.2px;
        }

        .copy-btn {
            background: #F0F4FA;
            border: 1px solid #E5EDFA;
            color: var(--blue);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .2s;
        }

        .copy-btn:active {
            transform: scale(0.9);
            background: #E5EDFA;
        }

        /* Security */
        .security {
            margin-top: 30px;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 11px 16px;
            border-radius: 30px;
            background: rgba(255,255,255,.55);
            border: 1px solid rgba(255,255,255,.9);
            color: #8792A4;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(40,60,100,.035);
        }

        .security i {
            color: #22A879;
            font-size: 13px;
        }

        /* Small footer */
        .footer {
            margin-top: 48px;
            color: #A1AABB;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .2px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111827;
            color: white;
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,.15);
            opacity: 0;
            visibility: hidden;
            transition: all .3s cubic-bezier(.16,1,.3,1);
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* Animation */
        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(22px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 380px) {
            .page {
                padding-left: 19px;
                padding-right: 19px;
            }

            .brand {
                margin-bottom: 32px;
            }

            .app-icon {
                width: 104px;
                height: 104px;
                font-size: 42px;
            }

            h1 {
                font-size: 29px;
            }

            .description {
                font-size: 14px;
            }

            .download-btn {
                min-height: 59px;
                font-size: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="ambient one"></div>
    <div class="ambient two"></div>

    <!-- Back -->
    <a href="javascript:history.back()" class="back-btn" aria-label="Go back">
        <i class="fa-solid fa-chevron-left"></i>
    </a>

    <main class="page">

        <section class="content">

            <!-- Brand -->
            <div class="brand">
                <i class="fa-solid fa-store"></i>
                BIKRIPAGE
            </div>

            <!-- App Icon -->
            <div class="icon-area">
                <div class="app-icon">
                    <i class="fa-solid fa-print"></i>
                </div>

                <div class="windows-badge">
                    <i class="fa-brands fa-windows"></i>
                </div>
            </div>

            <!-- Title -->
            <h1>Smart Print PC</h1>

            <p class="description">
                Enable zero-click background printing.
                Install the native utility on your Windows
                machine to seamlessly receive and print files.
            </p>

            <!-- Download -->
            <div class="download-card">
                <a
                    href="https://github.com/bikripage/smart-print-desktop/releases/download/Windows/SmartPrint-Setup.zip"
                    class="download-btn"
                >
                    <i class="fa-brands fa-windows"></i>
                    <span>Download for Windows</span>
                    <i class="fa-solid fa-arrow-down"
                       style="font-size:14px"></i>
                </a>
            </div>

            <!-- App Credentials Box -->
            <div class="creds-box" id="credsBox" style="display: none;">
                <div class="cred-item">
                    <div class="cred-info">
                        <span class="cred-label">Shop ID</span>
                        <span class="cred-val" id="dispShopId">...</span>
                    </div>
                    <button class="copy-btn" onclick="copyText('dispShopId')" aria-label="Copy ID">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
                <div class="cred-item">
                    <div class="cred-info">
                        <span class="cred-label">App Password</span>
                        <span class="cred-val" id="dispPwd">...</span>
                    </div>
                    <button class="copy-btn" onclick="copyText('dispPwd')" aria-label="Copy Password">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>

            <!-- Security -->
            <div class="security">
                <i class="fa-solid fa-shield-halved"></i>
                <span>End-to-End P2P Encryption</span>
            </div>

            <!-- Footer -->
            <div class="footer">
                A smarter way to print · BikriPage
            </div>

        </section>

    </main>

    <!-- Copy Toast -->
    <div id="toast" class="toast">Copied to clipboard!</div>

    <script>
    // Fetch saved credentials and display them
    window.addEventListener('DOMContentLoaded', () => {
        // ✨ NAYA: Ab dono jagah exact same keys fetch hongi
        const savedShopId = localStorage.getItem('BikriPage_active_shop');
        const savedPwd = localStorage.getItem('BikriPage_app_password');
        
        if (savedShopId && savedPwd) {
            document.getElementById('dispShopId').innerText = savedShopId;
            document.getElementById('dispPwd').innerText = savedPwd;
            document.getElementById('credsBox').style.display = 'block';
        }
    });

    // Copy functionality with Toast notification
    function copyText(elementId) {
        const textToCopy = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            showToast();
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }
</script>

</body>
</html>
