<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>BikriPage | Smart Print PC</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #000000; 
            color: #FFFFFF;
            -webkit-tap-highlight-color: transparent; 
        }
        
        /* Minimalist Glass Card */
        .glass-card {
            background: rgba(28, 28, 30, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        
        /* 3D Icon Box */
        .icon-box {
            background: linear-gradient(135deg, #0A84FF 0%, #005BB5 100%);
            box-shadow: 0 10px 30px rgba(10, 132, 255, 0.3);
            border-radius: 22.5%; /* Apple Squircle */
        }
        
        /* Copy Button Hover */
        .copy-btn {
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .copy-btn:active {
            transform: scale(0.9);
            opacity: 0.7;
        }

        /* Ambient Glow */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #0A84FF;
            filter: blur(120px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Background Glow -->
    <div class="glow top-[-10%] right-[-10%]"></div>
    <div class="glow bottom-[-10%] left-[-10%]" style="background: #5E5CE6; opacity: 0.1;"></div>

    <!-- Back Button -->
    <a href="javascript:history.back()" class="absolute top-12 left-6 w-10 h-10 glass-card rounded-full flex items-center justify-center text-[#0A84FF] active:scale-95 transition-transform z-50">
        <i class="fas fa-chevron-left pr-0.5 text-[17px]"></i>
    </a>

    <!-- Main Content Container -->
    <div class="w-full max-w-[360px] flex flex-col items-center text-center animate-fade-in z-10 mt-8">
        
        <!-- Branding -->
        <span class="text-[11px] font-bold tracking-widest uppercase text-gray-500 mb-8 flex items-center gap-2">
            <i class="fas fa-store text-gray-400"></i> BikriPage
        </span>
        
        <!-- App Icon -->
        <div class="w-24 h-24 icon-box flex items-center justify-center mb-6 relative">
            <i class="fas fa-print text-[40px] text-white"></i>
            <div class="absolute -bottom-2 -right-2 w-10 h-10 bg-[#1C1C1E] border border-gray-700 rounded-full flex items-center justify-center shadow-lg">
                <i class="fab fa-windows text-[16px] text-[#0A84FF]"></i>
            </div>
        </div>

        <!-- Typography -->
        <h1 class="text-[28px] font-bold tracking-tight mb-2 text-white">Smart Print PC</h1>
        <p class="text-[14px] text-gray-400 leading-relaxed mb-8 px-2 font-medium">
            Enable zero-click background printing. Install the native utility on your Windows machine to seamlessly receive files.
        </p>

        <!-- Download Button -->
        <a href="https://github.com/bikripage/smart-print-desktop/releases/download/Windows/SmartPrint-Setup.zip" 
           class="w-full bg-[#0A84FF] hover:bg-[#0071E3] text-white rounded-[18px] py-4 flex items-center justify-center gap-3 font-semibold text-[16px] active:scale-[0.97] transition-transform mb-8">
            <i class="fab fa-windows text-white text-[18px]"></i>
            Download for Windows
        </a>

        <!-- App Credentials Section -->
        <div class="w-full glass-card rounded-[22px] p-5 text-left mb-6">
            <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-4 border-b border-gray-700 pb-2">App Credentials</p>
            
            <!-- Shop ID -->
            <div class="flex justify-between items-center mb-4">
                <div>
                    <p class="text-[11px] text-gray-500 font-medium mb-0.5">Shop ID</p>
                    <p class="text-[15px] font-semibold text-white tracking-wide" id="dispShopId">Loading...</p>
                </div>
                <button class="copy-btn w-9 h-9 bg-gray-800 rounded-full flex items-center justify-center text-[#0A84FF]" onclick="copyText('dispShopId')" aria-label="Copy ID">
                    <i class="far fa-copy text-[14px]"></i>
                </button>
            </div>
            
            <!-- App Password -->
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-[11px] text-gray-500 font-medium mb-0.5">App Password</p>
                    <p class="text-[15px] font-semibold text-white tracking-wide" id="dispPwd">Loading...</p>
                </div>
                <button class="copy-btn w-9 h-9 bg-gray-800 rounded-full flex items-center justify-center text-[#0A84FF]" onclick="copyText('dispPwd')" aria-label="Copy Password">
                    <i class="far fa-copy text-[14px]"></i>
                </button>
            </div>
        </div>

        <!-- Security Note -->
        <div class="flex items-center justify-center gap-1.5 text-[11px] font-medium text-gray-500 pb-4">
            <i class="fas fa-lock text-[10px]"></i> End-to-End P2P Encryption
        </div>
        
    </div>

    <!-- Minimalist Toast -->
    <div id="toast" class="fixed top-12 left-1/2 transform -translate-x-1/2 bg-[#1C1C1E] text-white border border-gray-800 px-5 py-2.5 rounded-full text-[13px] font-medium shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i class="fas fa-check-circle text-[#34C759]"></i> Copied to clipboard
    </div>

    <script>
        // Load credentials from localStorage
        window.addEventListener('DOMContentLoaded', () => {
            // Updated to fetch exactly the keys mentioned in the provided dashboard.html file
            const urlParams = new URLSearchParams(window.location.search);
            const activeShop = urlParams.get('shop') || localStorage.getItem('BikriPage_active_shop');
            const savedPwd = localStorage.getItem('BikriPage_smartPrintPwd') || localStorage.getItem('BikriPage_pwd') || "Not Found"; // Added fallback
            
            if (activeShop) {
                document.getElementById('dispShopId').innerText = activeShop;
            } else {
                 document.getElementById('dispShopId').innerText = "Not Logged In";
            }
            
            document.getElementById('dispPwd').innerText = savedPwd;
        });

        // Copy functionality with smooth Toast
        let toastTimeout;
        function copyText(elementId) {
            const textToCopy = document.getElementById(elementId).innerText;
            if (textToCopy === "Not Logged In" || textToCopy === "Not Found" || textToCopy === "Loading...") return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0');
                
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.add('opacity-0');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
