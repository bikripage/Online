<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F3F4F6">
    <title>BikriPage | Smart Print PC</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F3F4F6; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        /* Premium Frosted Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08), 0 0 15px rgba(255, 255, 255, 0.5) inset;
        }
        
        /* 3D Icon Glow */
        .icon-glow {
            background: linear-gradient(135deg, #2563EB 0%, #4F46E5 100%);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.3), inset 0 2px 4px rgba(255,255,255,0.4);
        }

        /* Custom Animations */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes blobBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .animate-card {
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .animate-blob {
            animation: blobBounce 8s ease-in-out infinite;
        }
        
        .btn-hover-effect {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-effect:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .btn-hover-effect:active {
            transform: translateY(1px) scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-5 relative overflow-hidden">
    
    <!-- Animated Background Glowing Orbs -->
    <div class="absolute top-[-10%] left-[-10%] w-[350px] h-[350px] bg-blue-300/30 rounded-full blur-[80px] animate-blob z-0 pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[350px] h-[350px] bg-indigo-300/20 rounded-full blur-[80px] animate-blob z-0 pointer-events-none" style="animation-delay: 2s;"></div>
    <div class="absolute top-[20%] right-[10%] w-[200px] h-[200px] bg-purple-300/20 rounded-full blur-[60px] animate-blob z-0 pointer-events-none" style="animation-delay: 4s;"></div>

    <!-- BikriPage Branding Header -->
    <div class="absolute top-8 text-center w-full z-10 animate-[fadeIn_1s_ease-out]">
        <span class="bg-white/80 backdrop-blur-md px-5 py-2 rounded-full border border-white/60 text-[11px] font-black tracking-widest uppercase text-blue-600 shadow-sm flex items-center justify-center gap-2 w-max mx-auto">
            <i class="fas fa-store"></i> BikriPage
        </span>
    </div>

    <!-- Main Premium Card -->
    <div class="glass-card rounded-[36px] p-8 md:p-10 w-full max-w-[380px] flex flex-col items-center text-center animate-card relative z-10 mt-10">
        
        <!-- Floating App Icon with Windows Badge -->
        <div class="animate-float mb-8">
            <div class="w-28 h-28 icon-glow rounded-[28px] flex items-center justify-center relative">
                <i class="fas fa-print text-[44px] text-white drop-shadow-md"></i>
                <div class="absolute -bottom-2 -right-2 w-12 h-12 bg-white border-4 border-[#F3F4F6] rounded-full flex items-center justify-center shadow-lg">
                    <i class="fab fa-windows text-[20px] text-blue-600"></i>
                </div>
            </div>
        </div>

        <!-- Typography & Details -->
        <div class="w-full flex justify-center mb-1">
            <div class="bg-blue-50 text-blue-600 text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full mb-3 border border-blue-100/50 inline-block">
                Desktop Utility
            </div>
        </div>
        <h1 class="text-[26px] font-black tracking-tight mb-3 text-gray-900 leading-tight">Smart Print PC</h1>
        <p class="text-[14px] font-medium text-gray-500 mb-8 leading-relaxed px-1">
            Zero-click auto printing powered by <span class="font-bold text-gray-800">BikriPage</span>. Install the native Windows software to auto-receive files.
        </p>

        <!-- Download Button with Shimmer Effect -->
        <a href="https://github.com/bikripage/smart-print-desktop/releases/download/Windows/SmartPrint-Setup.zip" 
           class="w-full bg-gray-900 text-white rounded-2xl py-4 flex items-center justify-center gap-3 font-bold text-[16px] shadow-[0_10px_20px_rgba(0,0,0,0.15)] btn-hover-effect overflow-hidden relative group">
            <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent group-hover:animate-[shimmer_1.5s_infinite]"></div>
            <i class="fab fa-windows text-blue-400 text-[20px]"></i>
            Download for Windows
        </a>
        
    </div>

    <!-- Footer Security Note -->
    <p class="mt-8 text-[11px] font-bold text-gray-400 uppercase tracking-widest relative z-10 flex items-center gap-1.5 opacity-80">
        <i class="fas fa-shield-alt text-gray-400"></i> 100% Secure P2P Transfer
    </p>

</body>
</html>
