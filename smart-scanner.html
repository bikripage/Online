<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Smart Scanner POS | BikriPage</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root { --ink:#111827; --purple:#a855f7; }
    * { -webkit-tap-highlight-color:transparent; }
    body { background:#f2f2f7; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; }
    
    .glass { background:rgba(255,255,255,0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
    .panel { background:#fff; border-radius:24px; box-shadow:0 8px 30px rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.02); }
    
    .btn { transition:all .2s cubic-bezier(0.25, 1, 0.5, 1); }
    .btn:active { transform:scale(.95); opacity:0.9; }

    #video-preview { width: 100%; height: 100%; object-fit: cover; border-radius: 18px; display: block; }
    
    /* Cart Item Animation */
    .cart-item { animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    
    .modal-enter { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    
    .scan-line { width: 100%; height: 2px; background: var(--purple); box-shadow: 0 0 10px var(--purple), 0 0 20px var(--purple); position: absolute; top: 0; left: 0; animation: scanAnim 2s infinite linear; }
    @keyframes scanAnim { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

    /* Custom Scrollbar for Cart */
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen flex flex-col relative">

  <!-- Header with Back Button -->
  <header class="glass sticky top-0 z-30 border-b border-slate-200/50">
    <div class="max-w-xl mx-auto px-4 h-[66px] flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="goBack()" class="w-10 h-10 bg-slate-100 text-slate-700 rounded-full flex items-center justify-center hover:bg-slate-200 active:scale-95 transition">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="w-10 h-10 rounded-[14px] bg-purple-50 text-purple-600 flex items-center justify-center text-lg shadow-sm border border-purple-100">
          <i class="fas fa-bolt"></i>
        </div>
        <div>
          <p class="font-black text-sm text-slate-900 tracking-tight">Native POS</p>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">BikriPage</p>
        </div>
      </div>
      <span id="cart-badge" class="bg-rose-500 text-white text-[11px] font-black px-3 py-1.5 rounded-full shadow-sm">0 Items</span>
    </div>
  </header>

  <main class="flex-1 max-w-xl mx-auto w-full px-4 pt-5 pb-36">
    <!-- Camera Section -->
    <section class="panel p-2 mb-5 relative">
      <div class="bg-slate-900 h-[260px] rounded-[18px] flex items-center justify-center relative overflow-hidden shadow-inner">
         <video id="video-preview" autoplay muted playsinline></video>
         
         <!-- Target Box -->
         <div id="scan-overlay" class="absolute inset-0 z-10 pointer-events-none flex flex-col items-center justify-center">
            <div class="w-[220px] h-[160px] border-[3px] border-white/40 rounded-[20px] relative overflow-hidden">
                <div class="w-8 h-8 border-t-[5px] border-l-[5px] border-purple-500 absolute top-0 left-0 rounded-tl-[17px]"></div>
                <div class="w-8 h-8 border-t-[5px] border-r-[5px] border-purple-500 absolute top-0 right-0 rounded-tr-[17px]"></div>
                <div class="w-8 h-8 border-b-[5px] border-l-[5px] border-purple-500 absolute bottom-0 left-0 rounded-bl-[17px]"></div>
                <div class="w-8 h-8 border-b-[5px] border-r-[5px] border-purple-500 absolute bottom-0 right-0 rounded-br-[17px]"></div>
                <div class="scan-line"></div>
            </div>
         </div>
      </div>
      <div class="p-3 text-center">
        <p id="camera-status" class="text-[12px] font-bold text-slate-500 uppercase tracking-widest"><i class="fas fa-camera mr-1"></i> Starting Scanner...</p>
      </div>
    </section>

    <!-- Cart / Bill Section -->
    <section class="panel p-5 sm:p-6 shadow-sm">
      <div class="flex justify-between items-end mb-4 border-b border-slate-100 pb-3">
        <h2 class="text-lg font-black text-slate-900">Current Bill</h2>
        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Total: <span id="bill-total" class="text-xl text-slate-900 ml-1 font-black">₹0</span></p>
      </div>
      
      <!-- Cart Items Container -->
      <div id="bill-items-container" class="space-y-3 max-h-[300px] overflow-y-auto custom-scrollbar pr-1">
        <div id="empty-state" class="text-center py-8">
            <i class="fas fa-barcode text-4xl text-slate-200 mb-3"></i>
            <p class="text-[13px] text-slate-400 font-bold">Scan an item to add it to the cart.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Checkout Bar fixed at bottom -->
  <div class="fixed bottom-0 left-0 right-0 glass border-t border-slate-200/80 px-4 py-3 pb-7 z-40">
    <div class="max-w-xl mx-auto flex flex-col gap-2.5">
      <div class="flex gap-3">
        <button onclick="clearBill()" class="btn w-20 rounded-[16px] bg-slate-100 text-slate-600 font-bold text-[13px] h-[50px] border border-slate-200 shadow-sm shrink-0">
          Clear
        </button>
        <button id="save-bill-btn" onclick="sendToDashboard()" class="btn flex-1 rounded-[16px] bg-purple-600 text-white font-bold text-[15px] h-[50px] flex items-center justify-center gap-2 shadow-[0_8px_20px_rgba(168,85,247,0.3)]">
          <i class="fas fa-check-circle"></i> Complete Bill
        </button>
      </div>
      <button type="button" onclick="generateScannerQR()" class="btn w-full rounded-[16px] bg-slate-900 hover:bg-black text-white font-bold text-[14px] h-[46px] flex items-center justify-center gap-2 shadow-md">
        <i class="fas fa-qrcode"></i> Generate QR
      </button>
    </div>
  </div>

  <!-- UPI QR Modal -->
  <div id="qr-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-[24px] p-6 w-full max-w-xs shadow-2xl modal-enter border border-slate-100 text-center relative">
      <button onclick="closeQrModal()" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200 absolute top-4 right-4">
        <i class="fas fa-times"></i>
      </button>
      <h3 class="text-[18px] font-black text-slate-900">Scan to Pay</h3>
      <p id="qr-modal-amount" class="text-2xl font-black text-emerald-600 mt-1">₹0</p>
      <div id="qr-code-box" class="my-4 flex justify-center p-3 bg-slate-50 rounded-[18px] border border-slate-200"></div>
      <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">UPI Payment QR</p>
    </div>
  </div>

  <!-- New Item Modal -->
  <div id="item-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-[24px] p-6 w-full max-w-sm shadow-2xl modal-enter border border-slate-100">
      <div class="flex justify-between items-center mb-6">
        <h3 id="modal-title" class="text-[18px] font-black text-slate-900">New Item Found</h3>
        <button onclick="closeModal()" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 block mb-1">Barcode</label>
          <input type="text" id="modal-barcode" disabled class="w-full bg-slate-50 border border-slate-200 rounded-[14px] px-4 py-3 text-[14px] text-slate-500 font-bold">
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 block mb-1">Item Name</label>
          <input type="text" id="modal-name" placeholder="e.g. Parle G" class="w-full bg-white border border-slate-300 focus:border-purple-500 rounded-[14px] px-4 py-3 text-[15px] font-black text-slate-900 outline-none transition shadow-sm">
        </div>
        <div class="flex gap-3">
            <div class="flex-1">
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 block mb-1">MRP (₹)</label>
              <input type="number" id="modal-mrp" placeholder="0" class="w-full bg-white border border-slate-300 focus:border-purple-500 rounded-[14px] px-4 py-3 text-[15px] font-black text-slate-900 outline-none transition shadow-sm">
            </div>
            <div class="flex-1">
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 block mb-1">Sell Price (₹)</label>
              <input type="number" id="modal-rate" placeholder="0" class="w-full bg-white border border-slate-300 focus:border-purple-500 rounded-[14px] px-4 py-3 text-[15px] font-black text-slate-900 outline-none transition shadow-sm">
            </div>
        </div>
      </div>

      <button id="save-item-btn" onclick="saveItemToFirebase()" class="btn w-full mt-7 rounded-[16px] bg-slate-900 hover:bg-black text-white font-bold text-[15px] h-[54px] shadow-lg flex justify-center items-center gap-2">
        <i class="fas fa-save"></i> Save & Add to Cart
      </button>
    </div>
  </div>

  <script>
    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCWquftO39vqj83ZtYqtF_sDfkHVNpjd3k",
      authDomain: "bikripage-3aba6.firebaseapp.com",
      projectId: "bikripage-3aba6",
      storageBucket: "bikripage-3aba6.firebasestorage.app",
      messagingSenderId: "900882116436",
      appId: "1:900882116436:web:8a521d0308347ddcccdc92",
      measurementId: "G-ZP8L3S5R66"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const currentShopId = urlParams.get('shop') || localStorage.getItem('BikriPage_active_shop');

    if (!currentShopId) {
      alert("Shop ID missing. Please open from Dashboard.");
      window.location.href = "index.html";
    }

    let billItems = [];
    let isScanningPaused = false;
    let isEditing = false;
    let editingProductId = "";
    let nativeStream = null;

    function closeQrModal() {
      document.getElementById("qr-modal").classList.add("hidden");
      isScanningPaused = false;
      const line = document.querySelector('.scan-line');
      if (line) line.style.display = 'block';
    }

    async function generateScannerQR() {
      if (billItems.length === 0) {
        alert("Pehle list mein item scan/add karein!");
        return;
      }

      const totalAmount = billItems.reduce((sum, item) => sum + (item.price * item.qty), 0);
      if (totalAmount <= 0) return alert("Valid total amount required!");

      try {
        const doc = await db.collection('shops').doc(currentShopId).get();
        const shopData = doc.exists ? doc.data() : {};
        const upiId = (shopData.onlinePayment && shopData.upiId) ? shopData.upiId.trim() : '';

        if (!upiId) {
          alert("please allow recieve payment online");
          if (nativeStream) {
            nativeStream.getTracks().forEach(track => track.stop());
          }
          window.location.href = "dashboard.html?shop=" + encodeURIComponent(currentShopId) + "&openStep=7";
          return;
        }

        isScanningPaused = true;
        const line = document.querySelector('.scan-line');
        if (line) line.style.display = 'none';

        const shopName = shopData.shopName || 'Store';
        const upiLink = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(shopName)}&am=${totalAmount.toFixed(2)}&cu=INR`;

        document.getElementById("qr-modal-amount").textContent = "₹" + totalAmount;
        const qrBox = document.getElementById("qr-code-box");
        qrBox.innerHTML = "";
        new QRCode(qrBox, {
          text: upiLink,
          width: 190,
          height: 190,
          colorDark: "#111827",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
        document.getElementById("qr-modal").classList.remove("hidden");
      } catch (e) {
        alert("Error generating QR: " + e.message);
      }
    }

    function goBack() {
      isScanningPaused = true;
      if (nativeStream) {
        nativeStream.getTracks().forEach(track => track.stop());
      }

      const dashUrl = currentShopId
        ? "dashboard.html?shop=" + encodeURIComponent(currentShopId)
        : "dashboard.html";

      const fromDashboard =
        (document.referrer && document.referrer.includes("dashboard.html")) ||
        window.history.length <= 1;

      if (fromDashboard) {
        window.location.href = dashUrl;
        return;
      }

      const beforeHref = window.location.href;
      window.history.back();

      setTimeout(() => {
        if (window.location.href === beforeHref) {
          window.location.href = dashUrl;
        }
      }, 400);
    }

    function playBeepAndVibrate() {
      if ("vibrate" in navigator) navigator.vibrate(80);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(900, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }

    async function addToBill(code) {
      if (isScanningPaused) return;
      isScanningPaused = true;
      document.querySelector('.scan-line').style.display = 'none';
      playBeepAndVibrate();

      try {
        const snapshot = await db.collection('shops').doc(currentShopId).collection('products').where('barcode', '==', code).get();
        
        if (snapshot.empty) {
          openModal(code, "", "", "", false);
        } else {
          let doc = snapshot.docs[0];
          let itemData = doc.data();
          let existing = billItems.find(i => i.code === code);
          
          if (existing) {
            existing.qty += 1;
          } else {
            billItems.push({
              id: doc.id,
              code: code,
              name: itemData.name,
              price: itemData.price,
              mrp: itemData.mrp || itemData.price,
              qty: 1,
              unit: itemData.unit || 'pcs'
            });
          }
          updateBillUI();
          
          setTimeout(() => {
            isScanningPaused = false;
            document.querySelector('.scan-line').style.display = 'block';
          }, 1500);
        }
      } catch (e) {
        isScanningPaused = false;
      }
    }

    function openModal(code, name, mrp, rate, editMode, docId = "") {
      isEditing = editMode;
      editingProductId = docId;
      document.getElementById("modal-title").textContent = editMode ? "Edit Item" : "New Item Found";
      document.getElementById("modal-barcode").value = code;
      document.getElementById("modal-name").value = name;
      document.getElementById("modal-mrp").value = mrp || rate;
      document.getElementById("modal-rate").value = rate;
      document.getElementById("item-modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("item-modal").classList.add("hidden");
      isScanningPaused = false;
      document.querySelector('.scan-line').style.display = 'block';
    }

    async function saveItemToFirebase() {
      const code = document.getElementById("modal-barcode").value;
      const name = document.getElementById("modal-name").value.trim();
      const mrp = Number(document.getElementById("modal-mrp").value);
      const rate = Number(document.getElementById("modal-rate").value);

      if (!name || rate <= 0) return alert("Valid Name & Rate required");
      if (rate > mrp) return alert("Selling Price cannot be greater than MRP!");

      const btn = document.getElementById('save-item-btn');
      const origText = btn.innerHTML;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Saving...`;
      btn.disabled = true;

      try {
        if (isEditing && editingProductId) {
          await db.collection('shops').doc(currentShopId).collection('products').doc(editingProductId).update({
            name: name, mrp: mrp, price: rate
          });
          billItems.forEach(item => {
            if (item.code === code) { item.name = name; item.price = rate; item.mrp = mrp; }
          });
        } else {
          let newProd = {
            name: name, mrp: mrp, price: rate, barcode: code,
            qtySize: 1, unit: 'pcs', timestamp: firebase.firestore.FieldValue.serverTimestamp()
          };
          let docRef = await db.collection('shops').doc(currentShopId).collection('products').add(newProd);
          billItems.push({ id: docRef.id, code: code, name: name, price: rate, mrp: mrp, qty: 1, unit: 'pcs' });
        }

        closeModal();
        updateBillUI();
      } catch (e) {
        alert("Error: " + e.message);
      } finally {
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }

    async function editBillItem(code) {
      const snapshot = await db.collection('shops').doc(currentShopId).collection('products').where('barcode', '==', code).get();
      if (!snapshot.empty) {
        let doc = snapshot.docs[0];
        let data = doc.data();
        openModal(code, data.name, data.mrp, data.price, true, doc.id);
      }
    }

    function removeItem(code) {
      billItems = billItems.filter(item => item.code !== code);
      updateBillUI();
    }

    function updateQty(code, change) {
      let item = billItems.find(i => i.code === code);
      if (item) {
        item.qty += change;
        if (item.qty <= 0) {
          billItems = billItems.filter(i => i.code !== code);
        }
        updateBillUI();
      }
    }

    function updateBillUI() {
      const container = document.getElementById("bill-items-container");
      
      if (billItems.length === 0) {
        container.innerHTML = `
          <div id="empty-state" class="text-center py-8">
            <i class="fas fa-barcode text-4xl text-slate-200 mb-3"></i>
            <p class="text-[13px] text-slate-400 font-bold">Scan an item to add it to the cart.</p>
          </div>`;
        document.getElementById("bill-total").textContent = "₹0";
        document.getElementById("cart-badge").textContent = "0 Items";
        return;
      }

      let totalAmount = billItems.reduce((sum, current) => sum + (current.price * current.qty), 0);
      document.getElementById("bill-total").textContent = "₹" + totalAmount;
      document.getElementById("cart-badge").textContent = billItems.reduce((sum, cur) => sum + cur.qty, 0) + " Items";

      container.innerHTML = "";
      [...billItems].reverse().forEach((item) => {
        container.innerHTML += `
          <div class="cart-item bg-slate-50 border border-slate-100 rounded-[18px] p-3.5 flex justify-between items-center hover:shadow-sm transition">
            <div class="flex flex-col items-center gap-1 shrink-0 bg-white border border-purple-100 rounded-[10px] p-1 shadow-sm">
              <button onclick="updateQty('${item.code}', 1)" class="w-7 h-6 text-purple-600 hover:bg-purple-50 rounded-[6px] flex items-center justify-center transition active:scale-90">
                <i class="fas fa-plus text-[10px]"></i>
              </button>
              <span class="text-sm font-black text-[#111827] px-2 leading-none">${item.qty}</span>
              <button onclick="updateQty('${item.code}', -1)" class="w-7 h-6 text-purple-600 hover:bg-purple-50 rounded-[6px] flex items-center justify-center transition active:scale-90">
                <i class="fas fa-minus text-[10px]"></i>
              </button>
            </div>
            
            <div class="min-w-0 flex-1 px-3">
              <h4 class="text-[#111827] font-bold text-[14px] leading-tight truncate">${item.name}</h4>
              <p class="text-[11px] font-bold text-slate-400 mt-1">₹${item.price} / ${item.unit}</p>
            </div>

            <div class="flex flex-col items-end gap-2 shrink-0">
              <p class="text-[16px] font-black text-slate-900">₹${item.price * item.qty}</p>
              <div class="flex gap-2 mt-1">
                <button onclick="editBillItem('${item.code}')" class="w-7 h-7 bg-white border border-slate-200 rounded-[8px] text-slate-400 hover:text-purple-600 flex items-center justify-center transition shadow-sm active:scale-95">
                  <i class="fas fa-pen text-[10px]"></i>
                </button>
                <button onclick="removeItem('${item.code}')" class="w-7 h-7 bg-white border border-slate-200 rounded-[8px] text-slate-400 hover:text-rose-500 flex items-center justify-center transition shadow-sm active:scale-95">
                  <i class="fas fa-trash text-[10px]"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function clearBill() {
      billItems = [];
      updateBillUI();
    }

    function sendToDashboard() {
      if (billItems.length === 0) return alert("Cart is empty! Scan items first.");

      const btn = document.getElementById('save-bill-btn');
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Preparing...`;
      btn.disabled = true;

      let invoiceData = {
        fromScanner: true,
        items: billItems.map(item => ({
          id: item.id, name: item.name, price: item.price, qty: item.qty, unit: item.unit, total: item.price * item.qty
        }))
      };
      
      localStorage.setItem('BikriPage_Scanner_Invoice', JSON.stringify(invoiceData));
      
      if (nativeStream) nativeStream.getTracks().forEach(track => track.stop());

      window.location.href = "dashboard.html?shop=" + currentShopId + "&action=new_invoice";
    }

    async function initNativeScanner() {
      const video = document.getElementById('video-preview');
      const statusText = document.getElementById('camera-status');

      if (!('BarcodeDetector' in window)) {
        statusText.innerHTML = '<span class="text-rose-500">Native scanner not supported on this browser.</span>';
        return;
      }

      try {
        nativeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', focusMode: "continuous", width: { ideal: 1280 } }
        });
        video.srcObject = nativeStream;
        
        const barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });

        const scanLoop = async () => {
          if (!isScanningPaused && video.readyState === video.HAVE_ENOUGH_DATA) {
            try {
              const barcodes = await barcodeDetector.detect(video);
              if (barcodes.length > 0) addToBill(barcodes[0].rawValue);
            } catch (e) {}
          }
          requestAnimationFrame(scanLoop);
        };

        video.addEventListener('play', () => {
          statusText.innerHTML = '<i class="fas fa-check-circle text-purple-500"></i> Scanner Active';
          scanLoop();
        });

      } catch (err) {
        statusText.innerHTML = '<span class="text-rose-500">Camera access denied!</span>';
      }
    }

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === 'hidden') {
        isScanningPaused = true;
        if (nativeStream) nativeStream.getTracks().forEach(track => track.stop());
      } else {
        isScanningPaused = false;
        initNativeScanner();
      }
    });

    window.onload = () => {
      initNativeScanner();
    };
  </script>
</body>
</html>
